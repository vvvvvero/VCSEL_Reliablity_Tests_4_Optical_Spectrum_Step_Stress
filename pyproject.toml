[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "step_stress_spectra"
version = "1.0.0"
description = "Series 4 VCSEL optical spectrum step-stress measurement workflow with B1500 + Avantes spectrometer"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Veronica GaoZhan"}]
keywords = ["vcsel", "b1500", "avantes", "spectroscopy", "step stress", "reliability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.20.0",
    "pyvisa>=1.11.0",
    "pyvisa-py>=0.5.0",
    "PyQt5>=5.15.0",
    "matplotlib>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black>=21.0",
    "flake8>=3.9",
]

[project.urls]
Homepage = "https://github.com/vvvvvero/VCSEL_Reliablity_Tests_4_Optical_Spectrum_Step_Stress"
Repository = "https://github.com/vvvvvero/VCSEL_Reliablity_Tests_4_Optical_Spectrum_Step_Stress.git"
Issues = "https://github.com/vvvvvero/VCSEL_Reliablity_Tests_4_Optical_Spectrum_Step_Stress/issues"

[project.scripts]
step_stress_spectra = "step_stress_spectra.__main__:main"

[tool.setuptools]
packages = ["step_stress_spectra"]
py-modules = ["b1500_stress_cycle_spectroscopy"]
